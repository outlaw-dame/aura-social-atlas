[install]
# 24h supply-chain guard: skip package versions published less than a day ago.
minimumReleaseAge = 86400
# Each entry bypasses the 24h guard for one package — confirm with the user
# before adding any.
minimumReleaseAgeExcludes = ["@lovable.dev/vite-tanstack-config", "@lovable.dev/mcp-js"]

[test]
# relay/ is a separate package with its own dependencies and test preload (relay/bunfig.toml, which blocks the network);
# its tests run there (cd relay && bun test, and the relay CI workflow), not in the app's test run.
pathIgnorePatterns = ["relay/**"]
