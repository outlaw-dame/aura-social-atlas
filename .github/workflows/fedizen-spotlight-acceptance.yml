name: Fedizen Spotlight protected owner moderation acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/verify-fedizen-spotlight.ts'
      - 'src/lib/spotlight-moderation.server.ts'
      - 'src/lib/spotlight-personal.server.ts'
      - 'src/lib/fedizen.server.ts'
      - 'tests/spotlight-moderation.test.ts'
      - '.github/workflows/fedizen-spotlight-acceptance.yml'

permissions:
  contents: read

jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.4'
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Validate strict Spotlight policy and cursor tests
        run: bun test tests/spotlight-moderation.test.ts tests/fedizen-read.test.ts

  # No private bearer may be injected into PR, fork, push or scheduled runs.
  # Only a manually-approved main-branch run may read the two protected test secrets.
  live-owner-spotlight:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    environment: fedizen-integration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.4'
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify complete owner lists and actual eligible public cards
        env:
          FEDIZEN_TEST_READ_TOKEN: ${{ secrets.FEDIZEN_TEST_READ_TOKEN }}
          FEDIZEN_TEST_EXPECTED_HANDLE: ${{ secrets.FEDIZEN_TEST_EXPECTED_HANDLE }}
        run: bun scripts/verify-fedizen-spotlight.ts
