name: Fedizen OAuth ownership migration integration tests

on:
  pull_request:
    paths:
      - 'drizzle/migrations/0002_fedizen_connections.sql'
      - 'drizzle/reviewed-not-applied/0003_fedizen_oauth_ownership.sql'
      - 'drizzle/migrations/meta/_journal.json'
      - 'scripts/test-drizzle-release-gate.mjs'
      - 'scripts/test-fedizen-owner-migration.mjs'
      - 'scripts/disposable-postgres-url.mjs'
      - 'scripts/test-disposable-postgres-url.mjs'
      - '.github/workflows/fedizen-owner-migration-test.yml'
  push:
    branches: [main]
    paths:
      - 'drizzle/migrations/0002_fedizen_connections.sql'
      - 'drizzle/reviewed-not-applied/0003_fedizen_oauth_ownership.sql'
      - 'scripts/test-fedizen-owner-migration.mjs'
      - 'scripts/disposable-postgres-url.mjs'
      - 'scripts/test-disposable-postgres-url.mjs'
      - '.github/workflows/fedizen-owner-migration-test.yml'

permissions:
  contents: read

jobs:
  disposable-postgres-ownership:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: temporary-ci-only
          POSTGRES_DB: atlas_migration_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d atlas_migration_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.4'
      - name: Install pinned dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Assert unapproved migration cannot be applied automatically
        run: bun scripts/test-drizzle-release-gate.mjs
      - name: Assert migration target guard before opening any database connection
        run: bun scripts/test-disposable-postgres-url.mjs
      - name: Apply exact migrations and assert account deletion, uniqueness, and denied client access
        env:
          ATLAS_MIGRATION_TEST_DATABASE_URL: postgres://postgres:temporary-ci-only@localhost:5432/atlas_migration_test
        run: bun scripts/test-fedizen-owner-migration.mjs
