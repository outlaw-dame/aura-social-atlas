name: Fedizen OAuth ownership migration integration tests

on:
  pull_request:
    paths:
      - 'drizzle/migrations/0002_fedizen_connections.sql'
      - 'drizzle/migrations/0003_fedizen_oauth_ownership.sql'
      - 'drizzle/migrations/meta/_journal.json'
      - 'drizzle/migrations/meta/0003_snapshot.json'
      - 'scripts/test-fedizen-owner-migration.mjs'
      - '.github/workflows/fedizen-owner-migration-test.yml'
  push:
    branches: [main]
    paths:
      - 'drizzle/migrations/0002_fedizen_connections.sql'
      - 'drizzle/migrations/0003_fedizen_oauth_ownership.sql'
      - 'scripts/test-fedizen-owner-migration.mjs'
      - '.github/workflows/fedizen-owner-migration-test.yml'

permissions:
  contents: read

jobs:
  disposable-postgres-ownership:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: temporary-ci-only
          POSTGRES_DB: atlas_migration_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d atlas_migration_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.4'
      - name: Install pinned dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Assert integration test refuses substring-match and remote database URLs
        shell: bash
        run: |
          set -euo pipefail
          for target in \
            'postgres://postgres:ci-only@localhost:5432/atlas_migration_test_production' \
            'postgres://postgres:ci-only@db.example.com:5432/atlas_migration_test' \
            'postgres://postgres:ci-only@localhost:5433/atlas_migration_test'
          do
            if ATLAS_MIGRATION_TEST_DATABASE_URL="$target" bun scripts/test-fedizen-owner-migration.mjs >/dev/null 2>&1; then
              echo 'Unsafe migration test database URL accepted'
              exit 1
            fi
          done
      - name: Apply exact migrations and assert account deletion, uniqueness, and denied client access
        env:
          ATLAS_MIGRATION_TEST_DATABASE_URL: postgres://postgres:temporary-ci-only@localhost:5432/atlas_migration_test
        run: bun scripts/test-fedizen-owner-migration.mjs
