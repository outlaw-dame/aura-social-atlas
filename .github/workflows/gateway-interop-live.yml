name: Controlled external signed federation acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/gateway-interop-live.yml'

permissions:
  contents: read

jobs:
  signed-interop:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Independently verify one-shot signed federation acceptance
        env:
          RELAY: https://interop-negative-acceptance-staging.up.railway.app
        run: |
          python3 - <<'PY'
          import json
          import os
          import ssl
          import time
          import urllib.error
          import urllib.request

          base = os.environ['RELAY']
          url = base + '/interop-status'
          context = ssl.create_default_context()
          expected = {
              'observed initial signed Follow for rejection',
              'signed Reject transitioned pending subscription to rejected',
              'rejected relay Create not ingested',
              'observed fresh Follow after Reject and retry',
              'fresh signed Accept restored accepted subscription',
              'positive signed Create ingested for accepted relay',
              'unsigned Create not ingested',
              'wrong-owner Create not ingested',
              'tampered Create not ingested',
              'signed cleanup Delete removed positive control',
              'cleanup subscription disabled',
              'cleanup Undo observed',
          }
          state = None
          checks = []
          deadline = time.monotonic() + 110
          while time.monotonic() < deadline:
              req = urllib.request.Request(url, headers={'Accept': 'application/json'})
              with urllib.request.urlopen(req, timeout=12, context=context) as response:
                  assert response.status == 200
                  assert response.headers.get('Cache-Control') == 'no-store'
                  payload = json.loads(response.read(100_000))
              state = payload.get('state')
              checks = payload.get('checks')
              assert isinstance(checks, list) and all(isinstance(x, str) for x in checks)
              assert set(payload) == {'state', 'checks'}, 'Interop status exposes unexpected fields'
              if state in ('passed', 'failed'):
                  break
              assert state in ('ready', 'running'), f'Unexpected relay state: {state!r}'
              time.sleep(4)
          print('Interop result:', state)
          print('Validated checks:', json.dumps(checks, sort_keys=True))
          assert state == 'passed', 'Controlled signed federation run did not pass'
          assert expected <= set(checks), 'Required signed federation assertions missing'
          assert len(checks) == len(set(checks)), 'Duplicate or repeated assertion results'
          print('PASS: independent evidence for all required signed federation scenarios')
          PY
