name: Fedizen GraphQL contract probe offline tests

on:
  pull_request:
    paths:
      - 'scripts/probe-fedizen-graphql.mjs'
      - '.github/workflows/fedizen-graphql-probe.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/probe-fedizen-graphql.mjs'
      - '.github/workflows/fedizen-graphql-probe.yml'

permissions:
  contents: read

jobs:
  offline-probe-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/probe-fedizen-graphql.mjs --self-test
