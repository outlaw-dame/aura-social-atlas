name: Fedizen Mastodon REST compatibility observation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/probe-fedizen-mastodon-rest.mjs'
      - 'src/lib/fedizen.server.ts'
      - 'src/lib/fedizen.functions.ts'
      - 'src/lib/fedizen-feed.ts'
      - '.github/workflows/fedizen-mastodon-rest-probe.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/probe-fedizen-mastodon-rest.mjs'
      - 'src/lib/fedizen.server.ts'
      - 'src/lib/fedizen.functions.ts'
      - 'src/lib/fedizen-feed.ts'
      - '.github/workflows/fedizen-mastodon-rest-probe.yml'

permissions:
  contents: read

jobs:
  offline-rest-contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/probe-fedizen-mastodon-rest.mjs --self-test

  # Anonymous, fixed-origin, read-only HTTP GET requests only.
  # Never provide environment secrets or an authenticated session.
  # 401/403 verify denial; 404 is unconfirmed, not proof of route absence.
  live-rest-observation:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Observe Fedizen's deployed Mastodon REST contract and anonymous access boundaries
        run: node scripts/probe-fedizen-mastodon-rest.mjs
