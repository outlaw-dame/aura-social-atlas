name: Atlas Bonfire staging branch checks
on:
  push:
    branches:
      - main
      - staging/atlas-bonfire-client
      - staging/atlas-bonfire-client-v2
  pull_request:
    branches:
      - main
    paths:
      - 'src/lib/spotlight.ts'
      - 'src/lib/spotlight.functions.ts'
      - 'src/lib/spotlight-federated.server.ts'
      - 'src/lib/spotlight-personal.server.ts'
      - 'tests/spotlight-personal-sampling.test.ts'
      - 'src/lib/spotlight-curation.ts'
      - 'src/lib/spotlight-moderation.server.ts'
      - 'src/components/social/useCuratedSpotlight.ts'
      - 'src/components/social/useIntelligence.tsx'
      - 'src/lib/filter-engine.ts'
      - 'tests/spotlight-moderation.test.ts'
      - 'src/components/social/Spotlight.tsx'
      - 'src/components/f7/Discover.tsx'
      - 'tests/spotlight-federated.test.ts'
      - 'src/routes/fedizen-acceptance.tsx'
      - 'src/lib/fedizen-acceptance-view.ts'
      - 'src/routeTree.gen.ts'
      - 'tests/fedizen-acceptance-view.test.ts'
      - '.github/workflows/atlas-bonfire-staging.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  staging-app:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.4'
      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Test session authorization and sanitized staging UI
        run: |
          bun test tests/auth-runtime.test.ts tests/bonfire-atlas-acceptance.test.ts tests/fedizen-acceptance-view.test.ts tests/fedizen-session-intent.test.ts tests/fedizen-callback-origin.test.ts tests/fedizen-oauth-grant.test.ts
      - name: Test Spotlight provider boundaries and content classification
        run: bun test tests/spotlight-federated.test.ts tests/spotlight-moderation.test.ts tests/spotlight-personal-sampling.test.ts
      - name: Build Node server for Railway without privileged secrets
        env:
          NITRO_PRESET: node-server
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
          VITE_ATLAS_AUTH_RUNTIME: supabase
          VITE_ATLAS_GOOGLE_OAUTH_ENABLED: disabled
        run: |
          bun run build
          test -f .output/server/index.mjs
