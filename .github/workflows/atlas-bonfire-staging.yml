name: Atlas Bonfire staging branch checks
on:
  push:
    branches:
      - staging/atlas-bonfire-client
  pull_request:
    branches:
      - main
    paths:
      - 'src/routes/fedizen-acceptance.tsx'
      - 'src/lib/fedizen-acceptance-view.ts'
      - 'src/routeTree.gen.ts'
      - 'tests/fedizen-acceptance-view.test.ts'
      - '.github/workflows/atlas-bonfire-staging.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  staging-app:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.4'
      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Test session authorization and sanitized staging UI
        run: |
          bun test tests/bonfire-atlas-acceptance.test.ts tests/fedizen-acceptance-view.test.ts tests/fedizen-session-intent.test.ts tests/fedizen-callback-origin.test.ts tests/fedizen-oauth-grant.test.ts
      - name: Build Node server for Railway without privileged secrets
        env:
          NITRO_PRESET: node-server
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
        run: |
          bun run build
          test -f .output/server/index.mjs

  smoke-public-staging:
    if: github.event_name == 'pull_request' && github.head_ref == 'staging/atlas-bonfire-client'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify live staging public pages without credentials
        env:
          STAGING_ORIGIN: https://atlas-web-staging-staging-3f822964.up.railway.app
        run: |
          set -euo pipefail
          for path in / /fedizen-acceptance; do
            status=$(curl --proto '=https' --tlsv1.2 --silent --show-error --max-time 15 --output /dev/null --write-out '%{http_code}' "$STAGING_ORIGIN$path")
            if [[ "$status" != 200 ]]; then
              echo "Staging path $path returned HTTP $status (wanted 200)"
              exit 1
            fi
            echo "PASS staging HTTP $path: 200"
          done
