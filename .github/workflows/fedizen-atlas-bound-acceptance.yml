name: Fedizen Atlas-bound acceptance offline security checks

on:
  pull_request:
    paths:
      - 'src/lib/bonfire-acceptance.server.ts'
      - 'src/lib/bonfire-acceptance.functions.ts'
      - 'tests/bonfire-atlas-acceptance.test.ts'
      - '.github/workflows/fedizen-atlas-bound-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  atlas-bound-acceptance-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.4'
      - name: Install pinned dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Test session-bound acceptance without external credentials
        run: bun test tests/bonfire-atlas-acceptance.test.ts
